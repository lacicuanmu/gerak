let wk=null;let sport='lari',st='idle',pts=[],dist=0,el=0,last=0,spd=0,wid=null,wch=null,wl=null;

 $('d').textContent=$('sd').textContent=km.toFixed(2);$('t').textContent=$('st').textContent=fT(el);$('p').textContent=$('sp').textContent=P;
 $('s').textContent=km>0&&h>0?(km/h).toFixed(1):'0.0';$('n').textContent=(st==='run'?spd:0).toFixed(1);

$('go').onclick=()=>{if(st==='idle'){if(sport==='sepeda')$('hm').style.display='flex';else startRun()}else if(st==='run')st='pause';else{st='run';last=Date.now();awake()}render()};

 $('hist').innerHTML=h.length?h.map((x,i)=>{const km=x.d/1000;return '<div class="h"><span>'+(x.r?'<button class="rp" data-k="'+i+'">▶</button> ':'')+n[x.s]+(x.m?' (demo)':'')+' · '+new Date(x.at).toLocaleDateString(lang==='id'?'id-ID':'en-GB',{day:'numeric',month:'short'})+'</span><span>'+km.toFixed(2)+' km · '+fT(x.e)+' · '+fP(x.e/1000/km)+'/km</span></div>'}).join(''):'<div class="h"><span>'+tr('empty')+'</span></div>'}
let mp=null,line=null,mk=null,gain=0,altBuf=[],lastAlt=null,rp=false,rpId=0;const G=window.L;
if(!G)$('mapw').style.display='none';
function initMap(){if(!G||mp)return;mp=G.map('map',{zoomControl:false}).setView([-2.5,118],4);G.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mp);line=G.polyline([],{color:'#c6f432',weight:5}).addTo(mp);mk=G.marker([0,0],{icon:G.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],html:'<svg class="mk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#c6f432" fill-opacity=".25"/><path d="M12 3L18 19L12 15L6 19Z" fill="#c6f432" stroke="#0b1220" stroke-width="1.5"/></svg>'})})}

function setMk(la,ln,deg){if(deg>5&&deg<175)FL=1;else if(deg>185&&deg<355)FL=-1;$('ch').style.setProperty('--f',FL)}

 x.strokeStyle='#22d3ee';x.lineWidth=3;x.lineJoin='round';x.beginPath();P.forEach((p,i)=>{const q=f(p);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.stroke();[[P[0],'#fff'],[P[P.length-1],'#c6f432']].forEach(v=>{const q=f(v[0]);x.fillStyle=v[1];x.beginPath();x.arc(q[0],q[1],4,0,7);x.fill()})}

function prog(){if(rp)return;$('e').textContent=Math.round(gain);const t=parseFloat($('tg').value)||0;$('pb').style.width=(t>0?Math.min(100,dist/10/t):0)+'%'}

function replay(a){initMap();if(!mp||!a.r||a.r.length<2)return;const tok=++rpTok;cancelAnimationFrame(rpId);rp=true;rpOn=false;cs=0;cine(false);setChar(a.s,a.x||gender);
 const r=a.r,T=r[r.length-1][2]||1,D=r[r.length-1][3]||1,pl=r.map(p=>[p[0],p[1]]),Z=a.s==='sepeda'?16:17;
 mp.fitBounds(pl,{padding:[30,30]});line.setLatLngs(pl);mini(pl);$('mapw').scrollIntoView({behavior:'smooth',block:'center'});pill('START');$('d').textContent='0.00';$('t').textContent='00:00:00';$('pb').style.width='0%';
 setTimeout(()=>{if(tok!==rpTok)return;line.setLatLngs([]);cine(true);mp.setView(pl[0],Z,{animate:false});rpOn=true;let i=0,lk=0;const t0=performance.now();
  const f=now=>{if(tok!==rpTok)return;const u=Math.min(1,(now-t0)/15000),vt=u*T;while(i<r.length-2&&r[i+1][2]<=vt)i++;const A=r[i],B=r[i+1],dt=B[2]-A[2],s=dt>0?Math.min(1,(vt-A[2])/dt):1,la=A[0]+(B[0]-A[0])*s,ln=A[1]+(B[1]-A[1])*s,dd=A[3]+(B[3]-A[3])*s,tm=a.e*u;
   cs+=((dt>0?(B[3]-A[3])/dt*3.6:0)-cs)*.15;line.setLatLngs(pl.slice(0,i+1).concat([[la,ln]]));mp.setView([la,ln],Z,{animate:false});setMk(la,ln,brg({lat:A[0],lng:A[1]},{lat:B[0],lng:B[1]}));
   const k=Math.floor(dd/1000);if(k>lk){lk=k;pill('KM '+k)}
   $('d').textContent=(dd/1000).toFixed(2);$('t').textContent=fT(tm);$('p').textContent=dd>50?fP(tm/dd):'--';$('s').textContent=$('n').textContent=tm>0?(dd/1000/(tm/36e5)).toFixed(1):'0.0';$('pb').style.width=(dd/D*100)+'%';$('e').textContent=Math.round((a.g||0)*u);
   if(u<1)rpId=requestAnimationFrame(f);else{rpOn=false;cs=0;pill('FINISH');setTimeout(()=>{if(tok!==rpTok)return;rp=false;cine(false);rebuild();render();hist();mp.fitBounds(pl,{padding:[30,30]})},4000)}};
  rpId=requestAnimationFrame(f)},2200)}
$('hist').onclick=e=>{const b=e.target.closest('.rp');if(b&&st==='idle')replay(JSON.parse(localStorage.gerak||'[]')[+b.dataset.k])};
$('tg').value=localStorage.gerak_tg||'';$('tg').oninput=()=>{localStorage.gerak_tg=$('tg').value;prog()};

let gender=localStorage.gerak_g||'m',cs=0,rpOn=false,cn=false,lastKm=0,lastT=0,pT=0,rpTok=0,FL=1,CH=null,PV=null,CS='lari';
const ZOOM=()=>sport==='sepeda'?16:17;
function cine(on){if(cn===on||!mp)return;cn=on;$('mapw').classList.toggle('cine',on);mp.invalidateSize();if(line)line.setStyle({weight:on?8:5})}
function pill(t){const p=$('pill');p.textContent=t;p.classList.add('on');clearTimeout(pT);pT=setTimeout(()=>p.classList.remove('on'),2200)}
const PAL=g=>g==='f'?{sh:'#ff7a45',pt:'#7c3aed',ptd:'#5b21b6',hm:'#fb7185',fr:'#22d3ee',hr:'#2b2118'}:{sh:'#22d3ee',pt:'#475569',ptd:'#334155',hm:'#facc15',fr:'#ff7a45',hr:'#2b2118'};
const SK='#f2c9a0',SKD='#d9a97d';
const limb=(r,a,b,c,w,x)=>`<g data-r="${r}"><path d="M0 0V${a}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><g data-r="${r}k" transform="translate(0 ${a})"><path d="M0 0V${b}" stroke="${c}" stroke-width="${w-.8}" stroke-linecap="round"/>${x}</g></g>`;
function ik(H,Q,a,b,sg){const dx=Q[0]-H[0],dy=Q[1]-H[1],L=Math.hypot(dx,dy),d=Math.min(L,a+b-.01),A=Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d)))),ux=dx/L,uy=dy/L,nx=uy*sg,ny=-ux*sg,c=Math.cos(A),s=Math.sin(A);return[H[0]+a*(c*ux+s*nx),H[1]+a*(c*uy+s*ny)]}
function runnerSVG(g){const P=PAL(g),leg=(r,c)=>limb(r,17,17,c,5.2,`<path d="M0 17h6" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>`),arm=(r,c,hc)=>limb(r,12,11,c,4,`<circle cy="11" r="2.4" fill="${hc}"/>`),
 tail=g==='f'?`<path data-r="tl" d="M44 23q-9 2-8 12" stroke="${P.hr}" stroke-width="4" fill="none" stroke-linecap="round"/>`:'';
 return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="92" rx="16" ry="3" fill="#000" opacity=".35"/><g data-r="bd">${arm('a1',SKD,SKD)}${leg('l1',P.ptd)}<path d="M50 57V34" stroke="${P.sh}" stroke-width="9.5" stroke-linecap="round"/><path d="M50 57v-5" stroke="${P.pt}" stroke-width="10.5" stroke-linecap="round"/>${leg('l2',P.pt)}${tail}<circle cx="52" cy="25" r="7" fill="${SK}"/><path d="M44.5 24a7.5 7.5 0 0 1 15 0z" fill="${P.hr}"/><path d="M44 22.5h16" stroke="${P.hm}" stroke-width="2.2"/>${arm('a2',P.sh,SK)}</g></svg>`}
function bikerSVG(g){const P=PAL(g),w=x=>`<g data-r="${x}"><circle r="15" fill="none" stroke="#e2e8f0" stroke-width="3"/><circle r="9" fill="none" stroke="#475569" stroke-width="1"/><path d="M-15 0H15M0-15V15M-10.6-10.6L10.6 10.6M-10.6 10.6L10.6-10.6" stroke="#94a3b8" stroke-width="1"/></g>`,
 tail=g==='f'?`<path data-r="tl" d="M64 27q-9 3-10 10" stroke="${P.hr}" stroke-width="4" fill="none" stroke-linecap="round"/>`:'';
 return `<svg viewBox="0 0 120 100"><ellipse cx="60" cy="92" rx="44" ry="3" fill="#000" opacity=".35"/>${w('w1')}${w('w2')}<path data-r="g2" fill="none" stroke="${P.ptd}" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 76L52 48L82 50L92 76M58 76L52 48M58 76L82 50M28 76H58M82 50L85 43H92" stroke="${P.fr}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 46h13" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/><path data-r="cr" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><path d="M52 45L67 31" stroke="${P.sh}" stroke-width="9.5" stroke-linecap="round"/><path d="M52 45h-1" stroke="${P.pt}" stroke-width="10" stroke-linecap="round"/><path data-r="g1" fill="none" stroke="${P.pt}" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path data-r="ar" fill="none" stroke="${P.sh}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="89" cy="45" r="2.5" fill="${SK}"/>${tail}<circle cx="74" cy="26" r="7" fill="${SK}"/><path d="M63 26a11 10 0 0 1 22 0l-3 1H66z" fill="${P.hm}"/><path d="M68 18l1 7M74 17v8M79 18l-1 7" stroke="#0000002e" stroke-width="1.6"/><path d="M71 31l3 4" stroke="#0f172a" stroke-width="1.2"/><ellipse data-r="s1" rx="5" ry="2.2" fill="#0f172a"/><ellipse data-r="s2" rx="5" ry="2.2" fill="#0b1220"/></svg>`}
function mkChar(host,s,g){host.innerHTML=s==='sepeda'?bikerSVG(g):runnerSVG(g);const q=r=>host.querySelector('[data-r="'+r+'"]'),T=(r,v)=>{const e=q(r);if(e)e.setAttribute('transform',v)},D=(r,v)=>{const e=q(r);if(e)e.setAttribute('d',v)},o={s};
 if(s==='sepeda')o.upd=(p,wr)=>{T('w1','translate(28 76) rotate('+wr+')');T('w2','translate(92 76) rotate('+wr+')');const pe=[0,1].map(k=>{const a=p+k*Math.PI;return[58+7.5*Math.cos(a),76+7.5*Math.sin(a)]}),kn=pe.map(z=>ik([52,45],z,20,20,1));
  [1,2].forEach(k=>{const z=pe[k-1],n=kn[k-1];D('g'+k,'M52 45L'+n[0]+' '+n[1]+'L'+z[0]+' '+z[1]);T('s'+k,'translate('+(z[0]+2)+' '+(z[1]+1.5)+')')});D('cr','M58 76L'+pe[0][0]+' '+pe[0][1]+'M58 76L'+pe[1][0]+' '+pe[1][1]);const el=ik([67,32],[89,45],14,14,-1);D('ar','M67 32L'+el[0]+' '+el[1]+'L89 45');D('tl','M64 27q-9 '+(3+Math.sin(p)*2)+' -10 '+(10+Math.sin(p*2)*2))};
 else o.upd=(p,wr,m)=>{const run=s==='lari',A=(run?40:24)*m,K=(run?75:35)*m,AS=(run?48:26)*m,EL=run?88:25,lean=(run?12:4)*m,by=-(run?2.2:1)*m*Math.abs(Math.sin(p));
  T('bd','translate(0 '+by+') rotate('+lean+' 50 56)');[1,2].forEach(k=>{const a=p+(k-1)*Math.PI,hip=A*Math.sin(a),kn=8*m+K*Math.pow(Math.max(0,Math.cos(a-.15)),1.3),sh=AS*Math.sin(a+Math.PI);
   T('l'+k,'translate(50 56) rotate('+(-hip)+')');T('l'+k+'k','translate(0 17) rotate('+kn+')');T('a'+k,'translate(50 35) rotate('+(-sh)+')');T('a'+k+'k','translate(0 12) rotate('+(-EL*(.35+.65*m))+')')});D('tl','M44 23q-9 '+(2+Math.sin(p*2)*3*m)+' -8 '+(12+Math.sin(p*2)*3*m))};
 return o}
function setChar(s,g){CS=s;CH=mkChar($('ch'),s,g)}
function rebuild(){setChar(sport,gender);PV=mkChar($('pv'),sport,gender)}
const gSel=()=>document.querySelectorAll('#gch .chip').forEach(c=>c.classList.toggle('on',c.dataset.g===gender));
$('gch').onclick=e=>{const b=e.target.closest('.chip');if(!b||st!=='idle'||rp)return;gender=b.dataset.g;localStorage.gerak_g=gender;gSel();rebuild()};
let ph=0,pph=0,wr=0,mm=0,lt=performance.now();
function loop(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;const cv=rp?(rpOn?cs:0):(st==='run'&&Date.now()-lastT<5000?spd:0),mv=cv>.5;
 mm+=((mv?1:0)-mm)*Math.min(1,dt*8);const rate=CS==='sepeda'?3+.15*cv:CS==='lari'?7.5+.2*cv:5+.35*cv;ph+=mv?dt*rate:0;wr+=dt*Math.min(14,cv/3.6/.34)*57.3;
 pph+=dt*(PV&&PV.s==='sepeda'?4:PV&&PV.s==='lari'?8.5:6);if(CH&&cn)CH.upd(ph,wr,mm);if(PV)PV.upd(pph,pph*10,1);requestAnimationFrame(loop)}
let demoT=null,demoOn=false;
$('dm').onclick=()=>{if(st!=='idle'||rp||demoT)return;demoOn=true;startRun(true);const v={jalan:1.4,lari:2.8,sepeda:5.5}[sport],la0=-6.1754,ln0=106.8272,a=300,b=130,Lp=1439;let s=0,t=Date.now();
 demoT=setInterval(()=>{s+=v*6;t+=6000;const th=s/Lp*2*Math.PI;onPos({latitude:la0+b*Math.sin(th)/110540,longitude:ln0+a*Math.cos(th)/(111320*Math.cos(rad(la0))),accuracy:5,time:t,speed:v,altitude:10+Math.sin(th*3)*3})},1000)};
gSel();rebuild();requestAnimationFrame(loop);
let lastFix=0;
function gpsQ(a,none){const g=$('gq');g.style.display='block';if(none||a==null){g.style.color='#fbbf24';g.textContent=tr('gs');return}g.style.color=a<=20?'#4ade80':a<=40?'#fbbf24':'#f87171';g.textContent='GPS ±'+Math.round(a)+' m'+(a>40?' · '+tr('gw'):'')}
function locate(){if(!navigator.geolocation||!mp)return;navigator.geolocation.getCurrentPosition(p=>{gpsQ(p.coords.accuracy);if(!rp&&!pts.length)mp.setView([p.coords.latitude,p.coords.longitude],ZOOM(),{animate:false})},()=>gpsQ(null,true),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
